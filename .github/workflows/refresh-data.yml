name: Refresh public data

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "Start year for price/transaction history"
        required: true
        default: "2021"
      to_year:
        description: "End year for price/transaction history"
        required: true
        default: "2026"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate secrets
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)
      - run: python scripts/init_db.py
      - run: python scripts/seed_areas.py
      - name: Fetch transaction prices
        run: python scripts/fetch_reinfolib_transactions.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }}
      - name: Fetch official land prices
        run: python scripts/fetch_land_prices.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }} --interval 0.5
      - name: Fetch 2025 census preliminary population
        run: python scripts/fetch_population.py
      - name: Fetch 250m future population
        run: python scripts/fetch_future_population.py --zoom 12 --interval 0.3
      - run: python scripts/compute_scores.py
      - run: python scripts/build_site.py
      - run: pytest -q
      - name: Commit generated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "data: refresh public area datasets"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
