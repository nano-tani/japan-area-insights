  jshis_hazard:
    name: jshis_hazard
    needs: [prepare, jshis_ground]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-jshis_ground-${{ github.run_id }}", path: .}
      - name: Mark J-SHIS hazard state
        run: |
          if [ "${{ needs.prepare.outputs.run_jshis_hazard }}" = "true" ]; then
            python scripts/refresh_status.py phase --name jshis_hazard --status running
          else
            python scripts/refresh_status.py phase --name jshis_hazard --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_jshis_hazard == 'true' }}
        continue-on-error: true
