  elevation:
    name: elevation
    needs: [prepare, jshis_hazard]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-jshis_hazard-${{ github.run_id }}", path: .}
      - name: Mark elevation state
        run: |
          if [ "${{ needs.prepare.outputs.run_elevation }}" = "true" ]; then
            python scripts/refresh_status.py phase --name elevation --status running
          else
            python scripts/refresh_status.py phase --name elevation --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_elevation == 'true' }}
        continue-on-error: true
        run: python scripts/fetch_gsi_elevation.py --interval 0.15
      - name: Record elevation outcome
        if: ${{ needs.prepare.outputs.run_elevation == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name elevation --status success
          else
            python scripts/refresh_status.py phase --name elevation --status failure --message "elevation fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-elevation-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  build:
    name: build
    needs: [prepare, elevation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-elevation-${{ github.run_id }}
          path: .
      - name: Mark build running
        run: python scripts/refresh_status.py phase --name build --status running
      - id: build
        continue-on-error: true
        run: |
          python scripts/validate_refresh_db.py --require-stations
          python scripts/compute_scores.py
          python scripts/compute_station_scores.py
          python scripts/compute_detailed_analysis.py
          python scripts/build_site.py
          pytest -q
      - name: Record build outcome
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name build --status success
          else
            python scripts/refresh_status.py phase --name build --status failure --message "validation/build/test failed; public JSON was not committed"
          fi
          python scripts/refresh_status.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            data/cache/refresh-run.json
            web/data/refresh-status.json
          retention-days: 7
      - if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
      - name: Save validated database for the next incremental run
        uses: actions/cache/save@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
      - name: Refuse stale-code publication
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main moved from $GITHUB_SHA to $current_main while data was refreshing."
            echo "The validated database was cached. Re-run with scope=build from the latest main."
            exit 1
          fi
      - name: Commit generated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "data: refresh public area datasets"
            git push origin HEAD:main
          fi
