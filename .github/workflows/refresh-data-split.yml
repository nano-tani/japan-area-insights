name: Refresh public data (split)

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "Start year for price/transaction history"
        required: true
        default: "2021"
      to_year:
        description: "End year for price/transaction history"
        required: true
        default: "2026"
      extended_analysis:
        description: "Fetch extended public-data analysis"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate secrets
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)
      - run: python scripts/init_db.py
      - run: python scripts/seed_areas.py
      - name: Fetch transaction prices and detailed attributes
        run: python scripts/fetch_reinfolib_transactions.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }}
      - name: Fetch official land prices and point attributes
        run: python scripts/fetch_land_prices.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }} --interval 0.5
      - name: Fetch 2025 census preliminary population
        run: python scripts/fetch_population.py
      - name: Fetch 250m future population
        run: python scripts/fetch_future_population.py --zoom 12 --interval 0.3
      - name: Sync geographic foundation
        run: python scripts/sync_geography.py
      - name: Fetch public facilities
        run: python scripts/fetch_facilities.py --zoom 13 --interval 0.3
      - name: Fetch station and ridership data
        run: python scripts/fetch_transport.py --zoom 12 --interval 0.3
      - name: Build 1km station areas
        run: python scripts/sync_station_areas.py
      - name: Fetch station-filtered transaction history
        run: python scripts/fetch_station_transactions.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }} --interval 0.3
      - name: Fetch migration, housing, labor, education, health and economic statistics
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_extended_estat.py
      - name: Fetch appraisal reports
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_appraisals.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }} --interval 0.5
      - name: Fetch urban planning and hazard layers
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_extended_spatial.py --zoom 12 --interval 0.2
      - name: Fetch evacuation sites and disaster history
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_resilience.py --zoom 12 --interval 0.2
      - name: Upload working database
        uses: actions/upload-artifact@v4
        with:
          name: area-insights-db-collect
          path: database/area_insights.db
          if-no-files-found: error
          retention-days: 1

  enrich:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download working database
        uses: actions/download-artifact@v4
        with:
          name: area-insights-db-collect
          path: database
      - name: Fetch J-SHIS seismic and surface-ground meshes
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_jshis.py --interval 0.2
      - name: Fetch GSI elevation for populated meshes
        if: ${{ inputs.extended_analysis }}
        continue-on-error: true
        run: python scripts/fetch_gsi_elevation.py --interval 0.15
      - name: Upload enriched database
        uses: actions/upload-artifact@v4
        with:
          name: area-insights-db-enriched
          path: database/area_insights.db
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download enriched database
        uses: actions/download-artifact@v4
        with:
          name: area-insights-db-enriched
          path: database
      - name: Compute ward scores
        run: python scripts/compute_scores.py
      - name: Compute station-area metrics and scores
        run: python scripts/compute_station_scores.py
      - name: Compute detailed market analysis
        run: python scripts/compute_detailed_analysis.py
      - run: python scripts/build_site.py
      - run: pytest -q
      - name: Commit generated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "data: refresh public area datasets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
