name: Refresh public data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh phase: all / core / station / stats / spatial / build"
        required: true
        type: choice
        options:
          - all
          - core
          - station
          - stats
          - spatial
          - build
        default: all
      mode:
        description: "incremental reuses the last valid DB; full refreshes the selected history range"
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental
      from_year:
        description: "Optional start year. Blank = automatic (previous year for incremental, 5 years back for full)"
        required: false
        default: ""
      to_year:
        description: "Optional end year. Blank = current year"
        required: false
        default: ""
      rebuild_database:
        description: "Discard the cached DB and rebuild every phase from scratch"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "20 20 * * 0"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DB_ARTIFACT_RETENTION_DAYS: "2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.config.outputs.scope }}
      mode: ${{ steps.config.outputs.mode }}
      from_year: ${{ steps.config.outputs.from_year }}
      to_year: ${{ steps.config.outputs.to_year }}
      cache_restored: ${{ steps.config.outputs.cache_restored }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Refresh must run from main" && exit 1)
      - name: Restore last validated database
        uses: actions/cache/restore@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
          restore-keys: |
            area-insights-db-${{ runner.os }}-main-
      - id: config
        name: Resolve scope, mode and year range
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            scope="core"
            mode="incremental"
            from_year=""
            to_year=""
            rebuild="false"
          else
            scope="${{ inputs.scope }}"
            mode="${{ inputs.mode }}"
            from_year="${{ inputs.from_year }}"
            to_year="${{ inputs.to_year }}"
            rebuild="${{ inputs.rebuild_database }}"
          fi

          restored="false"
          if [ -s database/area_insights.db ]; then
            restored="true"
          fi

          if [ "$rebuild" = "true" ]; then
            rm -f database/area_insights.db
            restored="false"
            scope="all"
            mode="full"
          fi

          if [ "$restored" != "true" ]; then
            if [ "$scope" = "build" ]; then
              echo "No cached database is available for build-only."
              exit 1
            fi
            echo "No cached database found; falling back to all/full."
            scope="all"
            mode="full"
          fi

          current_year="$(date -u +%Y)"
          if [ -z "$to_year" ]; then
            to_year="$current_year"
          fi
          if [ -z "$from_year" ]; then
            if [ "$mode" = "incremental" ]; then
              from_year="$((to_year - 1))"
            else
              from_year="$((to_year - 5))"
            fi
          fi
          if [ "$from_year" -gt "$to_year" ]; then
            echo "from_year must be <= to_year"
            exit 1
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "from_year=$from_year" >> "$GITHUB_OUTPUT"
          echo "to_year=$to_year" >> "$GITHUB_OUTPUT"
          echo "cache_restored=$restored" >> "$GITHUB_OUTPUT"
          echo "Resolved: scope=$scope mode=$mode years=$from_year-$to_year cache=$restored"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/init_db.py
      - run: python scripts/seed_areas.py
      - name: Initialize refresh status
        run: |
          python scripts/refresh_status.py init \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --scope "${{ steps.config.outputs.scope }}" \
            --mode "${{ steps.config.outputs.mode }}" \
            --from-year "${{ steps.config.outputs.from_year }}" \
            --to-year "${{ steps.config.outputs.to_year }}" \
            --cache-restored "${{ steps.config.outputs.cache_restored }}"
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-db-prepare-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}

  core:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-prepare-${{ github.run_id }}
          path: .
      - name: Mark core skipped
        if: ${{ needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'core' }}
        run: python scripts/refresh_status.py phase --name core --status skipped --message "scope not selected"
      - name: Mark core running
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core' }}
        run: python scripts/refresh_status.py phase --name core --status running
      - id: fetch
        name: Refresh core ward datasets
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core' }}
        continue-on-error: true
        shell: bash
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)

          python scripts/fetch_reinfolib_transactions.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}"
          python scripts/fetch_land_prices.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.5
          python scripts/fetch_population.py

          need_reference="false"
          if [ "${{ needs.prepare.outputs.mode }}" = "full" ]; then
            need_reference="true"
          else
            python - <<'PY' || need_reference="true"
          import sqlite3
          conn = sqlite3.connect("database/area_insights.db")
          try:
              for table in ("future_population", "facilities", "stations"):
                  if conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0] <= 0:
                      raise SystemExit(1)
          finally:
              conn.close()
          PY
          fi

          if [ "$need_reference" = "true" ]; then
            echo "Refreshing annual/reference datasets."
            python scripts/fetch_future_population.py --zoom 12 --interval 0.3
            python scripts/fetch_facilities.py --zoom 13 --interval 0.3
            python scripts/fetch_transport.py --zoom 12 --interval 0.3
          else
            echo "Incremental mode: reusing cached future-population/facility/transport datasets."
          fi

          python scripts/sync_geo_units.py
      - name: Record core outcome
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name core --status success
          else
            python scripts/refresh_status.py phase --name core --status failure --message "core fetch failed; rerun the core phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-core-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail core phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  station:
    needs: [prepare, core]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-core-${{ github.run_id }}
          path: .
      - name: Mark station skipped
        if: ${{ needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'station' }}
        run: python scripts/refresh_status.py phase --name station --status skipped --message "scope not selected"
      - name: Mark station running
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station' }}
        run: python scripts/refresh_status.py phase --name station --status running
      - id: fetch
        name: Refresh station transactions
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          python scripts/sync_station_areas.py
          python scripts/fetch_station_transactions.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.3
      - name: Record station outcome
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name station --status success
          else
            python scripts/refresh_status.py phase --name station --status failure --message "station transaction fetch failed; rerun the station phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-station-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail station phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  stats:
    needs: [prepare, station]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-station-${{ github.run_id }}
          path: .
      - name: Mark stats skipped
        if: ${{ needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'stats' }}
        run: python scripts/refresh_status.py phase --name stats --status skipped --message "scope not selected"
      - name: Mark stats running
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats' }}
        run: python scripts/refresh_status.py phase --name stats --status running
      - id: fetch
        name: Refresh detailed statistics and appraisal
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)
          python scripts/fetch_extended_estat.py
          python scripts/fetch_appraisals.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.5
      - name: Record stats outcome
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name stats --status success
          else
            python scripts/refresh_status.py phase --name stats --status failure --message "extended statistics fetch failed; rerun the stats phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-stats-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail stats phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  spatial:
    needs: [prepare, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-stats-${{ github.run_id }}
          path: .
      - name: Mark spatial skipped
        if: ${{ needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'spatial' }}
        run: python scripts/refresh_status.py phase --name spatial --status skipped --message "scope not selected"
      - name: Mark spatial running
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial' }}
        run: python scripts/refresh_status.py phase --name spatial --status running
      - id: fetch
        name: Refresh urban, hazard, seismic and terrain layers
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          python scripts/fetch_extended_spatial.py --zoom 12 --interval 0.2
          python scripts/fetch_resilience.py --zoom 12 --interval 0.2
          python scripts/fetch_jshis.py --interval 0.2
          python scripts/fetch_gsi_elevation.py --interval 0.15
      - name: Record spatial outcome
        if: ${{ needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name spatial --status success
          else
            python scripts/refresh_status.py phase --name spatial --status failure --message "spatial fetch failed; rerun the spatial phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-spatial-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail spatial phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  build:
    needs: [prepare, spatial]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-spatial-${{ github.run_id }}
          path: .
      - name: Mark build running
        run: python scripts/refresh_status.py phase --name build --status running
      - id: build
        name: Validate, score, build and test
        continue-on-error: true
        run: |
          python scripts/validate_refresh_db.py --require-stations
          python scripts/compute_scores.py
          python scripts/compute_station_scores.py
          python scripts/compute_detailed_analysis.py
          python scripts/build_site.py
          pytest -q
      - name: Record build outcome
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name build --status success
          else
            python scripts/refresh_status.py phase --name build --status failure --message "validation/build/test failed; public JSON was not committed"
          fi
          python scripts/refresh_status.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            data/cache/refresh-run.json
            web/data/refresh-status.json
          retention-days: 7
      - name: Stop before publishing on validation failure
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
      - name: Save validated database for the next incremental run
        uses: actions/cache/save@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
      - name: Refuse stale-code publication
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main moved from $GITHUB_SHA to $current_main while data was refreshing."
            echo "The validated database was cached. Re-run with scope=build from the latest main."
            exit 1
          fi
      - name: Commit generated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "data: refresh public area datasets"
            git push origin HEAD:main
          fi
