name: Refresh public data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh phase: all / core / station / stats / spatial / build"
        required: true
        type: choice
        options:
          - all
          - core
          - station
          - stats
          - spatial
          - build
        default: all
      mode:
        description: "incremental reuses the last valid DB; full refreshes the selected history range"
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental
      from_year:
        description: "Optional start year. Blank = automatic"
        required: false
        default: ""
      to_year:
        description: "Optional end year. Blank = current year"
        required: false
        default: ""
      rebuild_database:
        description: "Discard the cached DB and rebuild every phase from scratch"
        required: true
        type: boolean
        default: false
      resume_from_run_id:
        description: "Optional completed Refresh public data run ID whose database artifact should be reused"
        required: false
        default: ""
      resume_from_phase:
        description: "Database artifact phase to reuse: auto selects the last successful phase"
        required: true
        type: choice
        options:
          - auto
          - prepare
          - core
          - station
          - stats
          - spatial
          - resilience
          - jshis_ground
          - jshis_hazard
          - elevation
        default: auto
  schedule:
    - cron: "20 20 * * 0"

permissions:
  actions: read
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DB_ARTIFACT_RETENTION_DAYS: "2"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.config.outputs.scope }}
      mode: ${{ steps.config.outputs.mode }}
      from_year: ${{ steps.config.outputs.from_year }}
      to_year: ${{ steps.config.outputs.to_year }}
      cache_restored: ${{ steps.config.outputs.cache_restored }}
      resume_active: ${{ steps.config.outputs.resume_active }}
      resume_phase: ${{ steps.config.outputs.resume_phase }}
      resume_run_id: ${{ steps.config.outputs.resume_run_id }}
      resume_artifact: ${{ steps.config.outputs.resume_artifact }}
      run_core: ${{ steps.config.outputs.run_core }}
      run_station: ${{ steps.config.outputs.run_station }}
      run_stats: ${{ steps.config.outputs.run_stats }}
      run_spatial: ${{ steps.config.outputs.run_spatial }}
      run_resilience: ${{ steps.config.outputs.run_resilience }}
      run_jshis_ground: ${{ steps.config.outputs.run_jshis_ground }}
      run_jshis_hazard: ${{ steps.config.outputs.run_jshis_hazard }}
      run_elevation: ${{ steps.config.outputs.run_elevation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Refresh must run from main" && exit 1)
      - name: Validate resume inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        env:
          RESUME_SCOPE: ${{ inputs.scope }}
          RESUME_REBUILD: ${{ inputs.rebuild_database }}
        run: |
          test "$RESUME_SCOPE" = "all" || (echo "resume requires scope=all" && exit 1)
          test "$RESUME_REBUILD" != "true" || (echo "resume cannot be combined with rebuild_database=true" && exit 1)
      - id: resolve_resume
        name: Resolve resume database artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        uses: actions/github-script@v7
        env:
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
          RESUME_FROM_PHASE: ${{ inputs.resume_from_phase }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runIdText = process.env.RESUME_FROM_RUN_ID.trim();
            const requestedPhase = (process.env.RESUME_FROM_PHASE || "auto").trim();
            const phases = [
              "elevation",
              "jshis_hazard",
              "jshis_ground",
              "resilience",
              "spatial",
              "stats",
              "station",
              "core",
              "prepare",
            ];
            if (!/^\d+$/.test(runIdText)) {
              core.setFailed("resume_from_run_id must be numeric");
              return;
            }
            const runId = Number(runIdText);
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const workflowPath = String(run.path || run.workflow_path || "");
            const isRefreshWorkflow = workflowPath === ".github/workflows/refresh-data.yml"
              || workflowPath.endsWith("/.github/workflows/refresh-data.yml")
              || (!workflowPath && run.name === "Refresh public data");
            if (!isRefreshWorkflow) {
              core.setFailed(`run ${runId} is not a Refresh public data workflow run`);
              return;
            }
            if (run.head_branch !== "main") {
              core.setFailed(`run ${runId} was not created from main`);
              return;
            }
            if (run.status !== "completed") {
              core.setFailed(`run ${runId} is not completed`);
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const artifactNames = new Set(
              artifacts.filter((artifact) => !artifact.expired).map((artifact) => artifact.name),
            );
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const successfulJobs = new Set(
              jobs.filter((job) => job.conclusion === "success").map((job) => String(job.name).split(" / ")[0]),
            );
            const candidates = requestedPhase === "auto" ? phases : [requestedPhase];
            if (!candidates.every((phase) => phases.includes(phase))) {
              core.setFailed(`invalid resume phase: ${requestedPhase}`);
              return;
            }
            const selected = candidates.find((phase) =>
              successfulJobs.has(phase) && artifactNames.has(`refresh-db-${phase}-${runId}`),
            );
            if (!selected) {
              core.setFailed(`no successful, unexpired database artifact found in run ${runId}`);
              return;
            }
            core.setOutput("source_run_id", String(runId));
            core.setOutput("source_phase", selected);
            core.setOutput("artifact_name", `refresh-db-${selected}-${runId}`);
            core.info(`Using refresh-db-${selected}-${runId}; source code ${run.head_sha} is not checked out`);
      - name: Restore database artifact from prior run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve_resume.outputs.artifact_name }}
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_resume.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore last validated database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_run_id == '' }}
        uses: actions/cache/restore@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
          restore-keys: |
            area-insights-db-${{ runner.os }}-main-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify resumed database artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        env:
          RESUME_SOURCE_RUN_ID: ${{ steps.resolve_resume.outputs.source_run_id }}
          RESUME_SOURCE_PHASE: ${{ steps.resolve_resume.outputs.source_phase }}
        run: |
          test -s database/area_insights.db || (echo "Resumed database artifact is missing" && exit 1)
          test -s data/cache/refresh-run.json || (echo "Resumed refresh metadata is missing" && exit 1)
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("data/cache/refresh-run.json").read_text(encoding="utf-8"))
          expected_run = os.environ["RESUME_SOURCE_RUN_ID"]
          expected_phase = os.environ["RESUME_SOURCE_PHASE"]
          if str(state.get("run", {}).get("run_id")) != expected_run:
              raise SystemExit("resume metadata run id mismatch")
          if state.get("phases", {}).get(expected_phase, {}).get("status") != "success":
              raise SystemExit(f"resume phase {expected_phase} is not marked successful")
          print(f"Verified run {expected_run} phase {expected_phase}")
          PY
      - run: python scripts/init_db.py
      - run: python scripts/seed_areas.py
      - id: config
        name: Resolve scope, resume point and year range
        shell: bash
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM_YEAR: ${{ inputs.from_year }}
          INPUT_TO_YEAR: ${{ inputs.to_year }}
          INPUT_REBUILD: ${{ inputs.rebuild_database }}
          RESUME_RUN_ID: ${{ steps.resolve_resume.outputs.source_run_id }}
          RESUME_PHASE: ${{ steps.resolve_resume.outputs.source_phase }}
          RESUME_ARTIFACT: ${{ steps.resolve_resume.outputs.artifact_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            scope="core"
            mode="incremental"
            from_year=""
            to_year=""
            rebuild="false"
          else
            scope="$INPUT_SCOPE"
            mode="$INPUT_MODE"
            from_year="$INPUT_FROM_YEAR"
            to_year="$INPUT_TO_YEAR"
            rebuild="$INPUT_REBUILD"
          fi

          resume_active="false"
          resume_rank="-1"
          resume_phase=""
          resume_run_id=""
          resume_artifact=""
          restored="false"

          if [ -n "$RESUME_RUN_ID" ]; then
            resume_active="true"
            resume_phase="$RESUME_PHASE"
            resume_run_id="$RESUME_RUN_ID"
            resume_artifact="$RESUME_ARTIFACT"
            restored="true"
            scope="all"
            case "$resume_phase" in
              prepare) resume_rank=0 ;;
              core) resume_rank=10 ;;
              station) resume_rank=20 ;;
              stats) resume_rank=30 ;;
              spatial) resume_rank=40 ;;
              resilience) resume_rank=50 ;;
              jshis_ground) resume_rank=60 ;;
              jshis_hazard) resume_rank=70 ;;
              elevation) resume_rank=80 ;;
              *) echo "unknown resume phase: $resume_phase"; exit 1 ;;
            esac
          else
            if [ -s database/area_insights.db ]; then
              restored="true"
            fi
            if [ "$rebuild" = "true" ]; then
              rm -f database/area_insights.db
              restored="false"
              scope="all"
              mode="full"
            fi
            if [ "$restored" != "true" ]; then
              if [ "$scope" = "build" ]; then
                echo "No cached database is available for build-only."
                exit 1
              fi
              echo "No cached database found; falling back to all/full."
              scope="all"
              mode="full"
            fi
          fi

          source_from_year=""
          source_to_year=""
          if [ "$resume_active" = "true" ] && [ -s data/cache/refresh-run.json ]; then
            source_from_year="$(jq -r '.run.from_year // empty' data/cache/refresh-run.json)"
            source_to_year="$(jq -r '.run.to_year // empty' data/cache/refresh-run.json)"
          fi
          if [ -z "$from_year" ] && [ -n "$source_from_year" ]; then from_year="$source_from_year"; fi
          if [ -z "$to_year" ] && [ -n "$source_to_year" ]; then to_year="$source_to_year"; fi
          current_year="$(date -u +%Y)"
          if [ -z "$to_year" ]; then to_year="$current_year"; fi
          if [ -z "$from_year" ]; then
            if [ "$mode" = "incremental" ]; then from_year="$((to_year - 1))"; else from_year="$((to_year - 5))"; fi
          fi
          [[ "$from_year" =~ ^[0-9]{4}$ ]] || (echo "from_year must be four digits" && exit 1)
          [[ "$to_year" =~ ^[0-9]{4}$ ]] || (echo "to_year must be four digits" && exit 1)
          [ "$from_year" -le "$to_year" ] || (echo "from_year must be <= to_year" && exit 1)

          run_core="false"
          run_station="false"
          run_stats="false"
          run_spatial="false"
          run_resilience="false"
          run_jshis_ground="false"
          run_jshis_hazard="false"
          run_elevation="false"

          if [ "$resume_active" = "true" ]; then
            [ "$resume_rank" -lt 10 ] && run_core="true"
            [ "$resume_rank" -lt 20 ] && run_station="true"
            [ "$resume_rank" -lt 30 ] && run_stats="true"
            [ "$resume_rank" -lt 40 ] && run_spatial="true"
            [ "$resume_rank" -lt 50 ] && run_resilience="true"
            [ "$resume_rank" -lt 60 ] && run_jshis_ground="true"
            [ "$resume_rank" -lt 70 ] && run_jshis_hazard="true"
            [ "$resume_rank" -lt 80 ] && run_elevation="true"
          else
            if [ "$scope" = "all" ] || [ "$scope" = "core" ]; then run_core="true"; fi
            if [ "$scope" = "all" ] || [ "$scope" = "station" ]; then run_station="true"; fi
            if [ "$scope" = "all" ] || [ "$scope" = "stats" ]; then run_stats="true"; fi
            if [ "$scope" = "all" ] || [ "$scope" = "spatial" ]; then
              run_spatial="true"
              run_resilience="true"
              run_jshis_ground="true"
              run_jshis_hazard="true"
              run_elevation="true"
            fi
          fi

          for pair in \
            "scope=$scope" "mode=$mode" "from_year=$from_year" "to_year=$to_year" \
            "cache_restored=$restored" "resume_active=$resume_active" \
            "resume_phase=$resume_phase" "resume_run_id=$resume_run_id" "resume_artifact=$resume_artifact" \
            "run_core=$run_core" "run_station=$run_station" "run_stats=$run_stats" \
            "run_spatial=$run_spatial" "run_resilience=$run_resilience" \
            "run_jshis_ground=$run_jshis_ground" "run_jshis_hazard=$run_jshis_hazard" \
            "run_elevation=$run_elevation"
          do
            echo "$pair" >> "$GITHUB_OUTPUT"
          done
          echo "Resolved: scope=$scope mode=$mode years=$from_year-$to_year resume=$resume_run_id/$resume_phase"
      - name: Initialize refresh status
        run: |
          python scripts/refresh_status.py init \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --scope "${{ steps.config.outputs.scope }}" \
            --mode "${{ steps.config.outputs.mode }}" \
            --from-year "${{ steps.config.outputs.from_year }}" \
            --to-year "${{ steps.config.outputs.to_year }}" \
            --cache-restored "${{ steps.config.outputs.cache_restored }}"
      - name: Record resume source
        if: ${{ steps.config.outputs.resume_active == 'true' }}
        run: |
          python scripts/refresh_status.py phase --name prepare --status success \
            --message "database artifact ${{ steps.config.outputs.resume_artifact }} restored from run ${{ steps.config.outputs.resume_run_id }}; workflow code is $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-db-prepare-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}

  core:
    name: core
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-prepare-${{ github.run_id }}", path: .}
      - name: Mark core state
        run: |
          if [ "${{ needs.prepare.outputs.run_core }}" = "true" ]; then
            python scripts/refresh_status.py phase --name core --status running
          else
            python scripts/refresh_status.py phase --name core --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_core == 'true' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY"
          test -n "$ESTAT_APP_ID"
          python scripts/fetch_reinfolib_transactions.py --from-year "${{ needs.prepare.outputs.from_year }}" --to-year "${{ needs.prepare.outputs.to_year }}"
          python scripts/fetch_land_prices.py --from-year "${{ needs.prepare.outputs.from_year }}" --to-year "${{ needs.prepare.outputs.to_year }}" --interval 0.5
          python scripts/fetch_population.py
          need_reference="false"
          if [ "${{ needs.prepare.outputs.mode }}" = "full" ]; then
            need_reference="true"
          else
            python - <<'PY' || need_reference="true"
          import sqlite3
          conn = sqlite3.connect("database/area_insights.db")
          try:
              for table in ("future_population", "facilities", "stations"):
                  if conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0] <= 0:
                      raise SystemExit(1)
          finally:
              conn.close()
          PY
          fi
          if [ "$need_reference" = "true" ]; then
            python scripts/fetch_future_population.py --zoom 12 --interval 0.3
            python scripts/fetch_facilities.py --zoom 13 --interval 0.3
            python scripts/fetch_transport.py --zoom 12 --interval 0.3
          fi
          python scripts/sync_geo_units.py
      - name: Record core outcome
        if: ${{ needs.prepare.outputs.run_core == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name core --status success
          else
            python scripts/refresh_status.py phase --name core --status failure --message "core fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-core-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  station:
    name: station
    needs: [prepare, core]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-core-${{ github.run_id }}", path: .}
      - name: Mark station state
        run: |
          if [ "${{ needs.prepare.outputs.run_station }}" = "true" ]; then
            python scripts/refresh_status.py phase --name station --status running
          else
            python scripts/refresh_status.py phase --name station --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_station == 'true' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY"
          python scripts/sync_station_areas.py
          python scripts/fetch_station_transactions.py --from-year "${{ needs.prepare.outputs.from_year }}" --to-year "${{ needs.prepare.outputs.to_year }}" --interval 0.3
      - name: Record station outcome
        if: ${{ needs.prepare.outputs.run_station == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name station --status success
          else
            python scripts/refresh_status.py phase --name station --status failure --message "station fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-station-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  stats:
    name: stats
    needs: [prepare, station]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-station-${{ github.run_id }}", path: .}
      - name: Mark stats state
        run: |
          if [ "${{ needs.prepare.outputs.run_stats }}" = "true" ]; then
            python scripts/refresh_status.py phase --name stats --status running
          else
            python scripts/refresh_status.py phase --name stats --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_stats == 'true' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY"
          test -n "$ESTAT_APP_ID"
          python scripts/fetch_extended_estat.py
          python scripts/fetch_appraisals.py --from-year "${{ needs.prepare.outputs.from_year }}" --to-year "${{ needs.prepare.outputs.to_year }}" --interval 0.5
      - name: Record stats outcome
        if: ${{ needs.prepare.outputs.run_stats == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name stats --status success
          else
            python scripts/refresh_status.py phase --name stats --status failure --message "stats fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-stats-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  spatial:
    name: spatial
    needs: [prepare, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-stats-${{ github.run_id }}", path: .}
      - name: Mark spatial state
        run: |
          if [ "${{ needs.prepare.outputs.run_spatial }}" = "true" ]; then
            python scripts/refresh_status.py phase --name spatial --status running
          else
            python scripts/refresh_status.py phase --name spatial --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_spatial == 'true' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY"
          python scripts/fetch_extended_spatial.py --zoom 12 --interval 0.2
      - name: Record spatial outcome
        if: ${{ needs.prepare.outputs.run_spatial == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name spatial --status success
          else
            python scripts/refresh_status.py phase --name spatial --status failure --message "urban/hazard fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-spatial-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  resilience:
    name: resilience
    needs: [prepare, spatial]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with: {name: "refresh-db-spatial-${{ github.run_id }}", path: .}
      - name: Mark resilience state
        run: |
          if [ "${{ needs.prepare.outputs.run_resilience }}" = "true" ]; then
            python scripts/refresh_status.py phase --name resilience --status running
          else
            python scripts/refresh_status.py phase --name resilience --status skipped --message "scope/resume checkpoint reused"
          fi
      - id: fetch
        if: ${{ needs.prepare.outputs.run_resilience == 'true' }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY"
          python scripts/fetch_resilience.py --zoom 12 --interval 0.2
      - name: Record resilience outcome
        if: ${{ needs.prepare.outputs.run_resilience == 'true' }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name resilience --status success
          else
            python scripts/refresh_status.py phase --name resilience --status failure --message "resilience fetch failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-resilience-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  jshis_ground:
    name: jshis_ground
    needs: [prepare, resilience]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
