name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      JAI_SITE_NAME: ${{ vars.JAI_SITE_NAME }}
      JAI_SITE_URL: ${{ vars.JAI_SITE_URL }}
      JAI_SITE_DESCRIPTION: ${{ vars.JAI_SITE_DESCRIPTION }}
      JAI_CUSTOM_DOMAIN: ${{ vars.JAI_CUSTOM_DOMAIN }}
      JAI_GOOGLE_SITE_VERIFICATION: ${{ vars.JAI_GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ensure public data exists
        run: |
          if [ ! -f web/data/areas.json ]; then
            python scripts/init_db.py
            python scripts/seed_areas.py
            python scripts/build_site.py
          fi
      - name: Build indexable public pages and SEO files
        run: python scripts/build_public_pages.py
      - name: Apply shared site chrome
        run: python scripts/apply_shared_chrome.py
      - name: Validate deployment configuration
        run: python scripts/check_deployment_readiness.py
      - run: pytest -q
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
