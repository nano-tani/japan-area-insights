name: Refresh public data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh phase: all / core / station / stats / spatial / build"
        required: true
        type: choice
        options:
          - all
          - core
          - station
          - stats
          - spatial
          - build
        default: all
      mode:
        description: "incremental reuses the last valid DB; full refreshes the selected history range"
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental
      from_year:
        description: "Optional start year. Blank = automatic (previous year for incremental, 5 years back for full)"
        required: false
        default: ""
      to_year:
        description: "Optional end year. Blank = current year"
        required: false
        default: ""
      rebuild_database:
        description: "Discard the cached DB and rebuild every phase from scratch"
        required: true
        type: boolean
        default: false
      resume_from_run_id:
        description: "Optional completed Refresh public data run ID whose database artifact should be reused"
        required: false
        default: ""
      resume_from_phase:
        description: "Database artifact phase to reuse: auto selects the last successful phase"
        required: true
        type: choice
        options:
          - auto
          - prepare
          - core
          - station
          - stats
          - spatial
        default: auto
  schedule:
    - cron: "20 20 * * 0"

permissions:
  actions: read
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DB_ARTIFACT_RETENTION_DAYS: "2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.config.outputs.scope }}
      mode: ${{ steps.config.outputs.mode }}
      from_year: ${{ steps.config.outputs.from_year }}
      to_year: ${{ steps.config.outputs.to_year }}
      cache_restored: ${{ steps.config.outputs.cache_restored }}
      resume_active: ${{ steps.config.outputs.resume_active }}
      resume_phase: ${{ steps.config.outputs.resume_phase }}
      resume_run_id: ${{ steps.config.outputs.resume_run_id }}
      resume_artifact: ${{ steps.config.outputs.resume_artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Refresh must run from main" && exit 1)
      - name: Validate resume inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        env:
          RESUME_SCOPE: ${{ inputs.scope }}
          RESUME_REBUILD: ${{ inputs.rebuild_database }}
        run: |
          test "$RESUME_SCOPE" = "all" || (echo "resume requires scope=all so downstream phases can run" && exit 1)
          test "$RESUME_REBUILD" != "true" || (echo "resume cannot be combined with rebuild_database=true" && exit 1)
      - id: resolve_resume
        name: Resolve resume database artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        uses: actions/github-script@v7
        env:
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
          RESUME_FROM_PHASE: ${{ inputs.resume_from_phase }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runIdText = process.env.RESUME_FROM_RUN_ID.trim();
            const requestedPhase = (process.env.RESUME_FROM_PHASE || "auto").trim();
            const phases = ["spatial", "stats", "station", "core", "prepare"];
            if (!/^\d+$/.test(runIdText)) {
              core.setFailed("resume_from_run_id must be a numeric workflow run ID");
              return;
            }

            const runId = Number(runIdText);
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const workflowPath = String(run.path || run.workflow_path || "");
            const isRefreshWorkflow = workflowPath === ".github/workflows/refresh-data.yml"
              || workflowPath.endsWith("/.github/workflows/refresh-data.yml")
              || (!workflowPath && run.name === "Refresh public data");
            if (!isRefreshWorkflow) {
              core.setFailed(`run ${runId} is not a Refresh public data workflow run`);
              return;
            }
            if (run.head_branch !== "main") {
              core.setFailed(`run ${runId} was not created from main (branch=${run.head_branch || "unknown"})`);
              return;
            }
            if (run.status !== "completed") {
              core.setFailed(`run ${runId} is not completed (status=${run.status})`);
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const artifactByName = new Map(
              artifacts.filter((artifact) => !artifact.expired).map((artifact) => [artifact.name, artifact]),
            );
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const successfulJobs = new Set(
              jobs
                .filter((job) => job.conclusion === "success")
                .map((job) => String(job.name).split(" / ")[0]),
            );
            const candidates = requestedPhase === "auto" ? phases : [requestedPhase];
            if (!candidates.every((phase) => phases.includes(phase))) {
              core.setFailed(`resume_from_phase must be one of auto, ${phases.slice().reverse().join(", ")}`);
              return;
            }
            const selectedPhase = candidates.find((phase) =>
              successfulJobs.has(phase) && artifactByName.has(`refresh-db-${phase}-${runId}`),
            );
            if (!selectedPhase) {
              core.setFailed(
                `no successful, unexpired database artifact found in run ${runId} for phase ${requestedPhase}`,
              );
              return;
            }

            const artifactName = `refresh-db-${selectedPhase}-${runId}`;
            core.setOutput("source_run_id", String(runId));
            core.setOutput("source_phase", selectedPhase);
            core.setOutput("artifact_name", artifactName);
            core.setOutput("source_sha", run.head_sha || "");
            core.info(
              `Using ${artifactName} from ${run.html_url}; source code ${run.head_sha || "unknown"} will not be checked out`,
            );
      - name: Restore database artifact from prior run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve_resume.outputs.artifact_name }}
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_resume.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore last validated database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_from_run_id == '' }}
        uses: actions/cache/restore@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
          restore-keys: |
            area-insights-db-${{ runner.os }}-main-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify resumed database artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_from_run_id != '' }}
        env:
          RESUME_SOURCE_RUN_ID: ${{ steps.resolve_resume.outputs.source_run_id }}
          RESUME_SOURCE_PHASE: ${{ steps.resolve_resume.outputs.source_phase }}
        run: |
          test -s database/area_insights.db || (echo "Resumed database artifact is missing" && exit 1)
          test -s data/cache/refresh-run.json || (echo "Resumed refresh metadata artifact is missing" && exit 1)
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("data/cache/refresh-run.json").read_text(encoding="utf-8"))
          run = state.get("run", {})
          expected_run = os.environ["RESUME_SOURCE_RUN_ID"]
          expected_phase = os.environ["RESUME_SOURCE_PHASE"]
          if str(run.get("run_id")) != expected_run:
              raise SystemExit(
                  f"resume metadata belongs to run {run.get('run_id')}, expected {expected_run}"
              )
          phase = state.get("phases", {}).get(expected_phase, {})
          if phase.get("status") != "success":
              raise SystemExit(
                  f"resume artifact phase {expected_phase} is not marked successful: {phase.get('status')}"
              )
          print(f"Verified database artifact from run {expected_run}, phase {expected_phase}")
          PY
      - run: python scripts/init_db.py
      - run: python scripts/seed_areas.py
      - id: config
        name: Resolve scope, mode and year range
        shell: bash
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM_YEAR: ${{ inputs.from_year }}
          INPUT_TO_YEAR: ${{ inputs.to_year }}
          INPUT_REBUILD: ${{ inputs.rebuild_database }}
          RESUME_SOURCE_RUN_ID: ${{ steps.resolve_resume.outputs.source_run_id }}
          RESUME_SOURCE_PHASE: ${{ steps.resolve_resume.outputs.source_phase }}
          RESUME_ARTIFACT_NAME: ${{ steps.resolve_resume.outputs.artifact_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            scope="core"
            mode="incremental"
            from_year=""
            to_year=""
            rebuild="false"
          else
            scope="$INPUT_SCOPE"
            mode="$INPUT_MODE"
            from_year="$INPUT_FROM_YEAR"
            to_year="$INPUT_TO_YEAR"
            rebuild="$INPUT_REBUILD"
          fi

          resume_active="false"
          resume_run_id=""
          resume_phase=""
          resume_artifact=""
          if [ -n "$RESUME_SOURCE_RUN_ID" ]; then
            resume_active="true"
            resume_run_id="$RESUME_SOURCE_RUN_ID"
            resume_phase="$RESUME_SOURCE_PHASE"
            resume_artifact="$RESUME_ARTIFACT_NAME"
            scope="all"
            restored="true"
          else
            restored="false"
            if [ -s database/area_insights.db ]; then
              restored="true"
            fi

            if [ "$rebuild" = "true" ]; then
              rm -f database/area_insights.db
              restored="false"
              scope="all"
              mode="full"
            fi

            if [ "$restored" != "true" ]; then
              if [ "$scope" = "build" ]; then
                echo "No cached database is available for build-only."
                exit 1
              fi
              echo "No cached database found; falling back to all/full."
              scope="all"
              mode="full"
            fi
          fi

          source_from_year=""
          source_to_year=""
          if [ "$resume_active" = "true" ] && [ -s data/cache/refresh-run.json ]; then
            source_from_year="$(jq -r '.run.from_year // empty' data/cache/refresh-run.json)"
            source_to_year="$(jq -r '.run.to_year // empty' data/cache/refresh-run.json)"
          fi

          if [ -z "$to_year" ] && [ -n "$source_to_year" ]; then
            to_year="$source_to_year"
          fi
          if [ -z "$from_year" ] && [ -n "$source_from_year" ]; then
            from_year="$source_from_year"
          fi

          if [ -n "$from_year" ] && ! [[ "$from_year" =~ ^[0-9]{4}$ ]]; then
            echo "from_year must be a four-digit year"
            exit 1
          fi
          if [ -n "$to_year" ] && ! [[ "$to_year" =~ ^[0-9]{4}$ ]]; then
            echo "to_year must be a four-digit year"
            exit 1
          fi

          current_year="$(date -u +%Y)"
          if [ -z "$to_year" ]; then
            to_year="$current_year"
          fi
          if [ -z "$from_year" ]; then
            if [ "$mode" = "incremental" ]; then
              from_year="$((to_year - 1))"
            else
              from_year="$((to_year - 5))"
            fi
          fi
          if [ "$from_year" -gt "$to_year" ]; then
            echo "from_year must be <= to_year"
            exit 1
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "from_year=$from_year" >> "$GITHUB_OUTPUT"
          echo "to_year=$to_year" >> "$GITHUB_OUTPUT"
          echo "cache_restored=$restored" >> "$GITHUB_OUTPUT"
          echo "resume_active=$resume_active" >> "$GITHUB_OUTPUT"
          echo "resume_run_id=$resume_run_id" >> "$GITHUB_OUTPUT"
          echo "resume_phase=$resume_phase" >> "$GITHUB_OUTPUT"
          echo "resume_artifact=$resume_artifact" >> "$GITHUB_OUTPUT"
          echo "Resolved: scope=$scope mode=$mode years=$from_year-$to_year cache=$restored resume=$resume_run_id/$resume_phase"
      - name: Initialize refresh status
        run: |
          python scripts/refresh_status.py init \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --scope "${{ steps.config.outputs.scope }}" \
            --mode "${{ steps.config.outputs.mode }}" \
            --from-year "${{ steps.config.outputs.from_year }}" \
            --to-year "${{ steps.config.outputs.to_year }}" \
            --cache-restored "${{ steps.config.outputs.cache_restored }}"
      - name: Record resume source
        if: ${{ steps.config.outputs.resume_active == 'true' }}
        run: |
          python scripts/refresh_status.py phase \
            --name prepare \
            --status success \
            --message "database artifact ${{ steps.config.outputs.resume_artifact }} restored from run ${{ steps.config.outputs.resume_run_id }}; workflow code is $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-db-prepare-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}

  core:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-prepare-${{ github.run_id }}
          path: .
      - name: Mark core skipped
        if: ${{ needs.prepare.outputs.resume_active != 'true' && needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'core' }}
        run: python scripts/refresh_status.py phase --name core --status skipped --message "scope not selected"
      - name: Mark core restored
        if: ${{ needs.prepare.outputs.resume_active == 'true' && (needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station' || needs.prepare.outputs.resume_phase == 'stats' || needs.prepare.outputs.resume_phase == 'spatial') }}
        run: |
          python scripts/refresh_status.py phase --name core --status skipped \
            --message "database restored from run ${{ needs.prepare.outputs.resume_run_id }} artifact ${{ needs.prepare.outputs.resume_artifact }}"
      - name: Mark core running
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare') }}
        run: python scripts/refresh_status.py phase --name core --status running
      - id: fetch
        name: Refresh core ward datasets
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare') }}
        continue-on-error: true
        shell: bash
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)

          python scripts/fetch_reinfolib_transactions.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}"
          python scripts/fetch_land_prices.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.5
          python scripts/fetch_population.py

          need_reference="false"
          if [ "${{ needs.prepare.outputs.mode }}" = "full" ]; then
            need_reference="true"
          else
            python - <<'PY' || need_reference="true"
          import sqlite3
          conn = sqlite3.connect("database/area_insights.db")
          try:
              for table in ("future_population", "facilities", "stations"):
                  if conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0] <= 0:
                      raise SystemExit(1)
          finally:
              conn.close()
          PY
          fi

          if [ "$need_reference" = "true" ]; then
            echo "Refreshing annual/reference datasets."
            python scripts/fetch_future_population.py --zoom 12 --interval 0.3
            python scripts/fetch_facilities.py --zoom 13 --interval 0.3
            python scripts/fetch_transport.py --zoom 12 --interval 0.3
          else
            echo "Incremental mode: reusing cached future-population/facility/transport datasets."
          fi

          python scripts/sync_geo_units.py
      - name: Record core outcome
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'core') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare') }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name core --status success
          else
            python scripts/refresh_status.py phase --name core --status failure --message "core fetch failed; rerun the core phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-core-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail core phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  station:
    needs: [prepare, core]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-core-${{ github.run_id }}
          path: .
      - name: Mark station skipped
        if: ${{ needs.prepare.outputs.resume_active != 'true' && needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'station' }}
        run: python scripts/refresh_status.py phase --name station --status skipped --message "scope not selected"
      - name: Mark station restored
        if: ${{ needs.prepare.outputs.resume_active == 'true' && (needs.prepare.outputs.resume_phase == 'station' || needs.prepare.outputs.resume_phase == 'stats' || needs.prepare.outputs.resume_phase == 'spatial') }}
        run: |
          python scripts/refresh_status.py phase --name station --status skipped \
            --message "database restored from run ${{ needs.prepare.outputs.resume_run_id }} artifact ${{ needs.prepare.outputs.resume_artifact }}"
      - name: Mark station running
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core') }}
        run: python scripts/refresh_status.py phase --name station --status running
      - id: fetch
        name: Refresh station transactions
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core') }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          python scripts/sync_station_areas.py
          python scripts/fetch_station_transactions.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.3
      - name: Record station outcome
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'station') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core') }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name station --status success
          else
            python scripts/refresh_status.py phase --name station --status failure --message "station transaction fetch failed; rerun the station phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-station-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail station phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  stats:
    needs: [prepare, station]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-station-${{ github.run_id }}
          path: .
      - name: Mark stats skipped
        if: ${{ needs.prepare.outputs.resume_active != 'true' && needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'stats' }}
        run: python scripts/refresh_status.py phase --name stats --status skipped --message "scope not selected"
      - name: Mark stats restored
        if: ${{ needs.prepare.outputs.resume_active == 'true' && (needs.prepare.outputs.resume_phase == 'stats' || needs.prepare.outputs.resume_phase == 'spatial') }}
        run: |
          python scripts/refresh_status.py phase --name stats --status skipped \
            --message "database restored from run ${{ needs.prepare.outputs.resume_run_id }} artifact ${{ needs.prepare.outputs.resume_artifact }}"
      - name: Mark stats running
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station') }}
        run: python scripts/refresh_status.py phase --name stats --status running
      - id: fetch
        name: Refresh detailed statistics and appraisal
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station') }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          test -n "$ESTAT_APP_ID" || (echo "ESTAT_APP_ID is missing" && exit 1)
          python scripts/fetch_extended_estat.py
          python scripts/fetch_appraisals.py \
            --from-year "${{ needs.prepare.outputs.from_year }}" \
            --to-year "${{ needs.prepare.outputs.to_year }}" \
            --interval 0.5
      - name: Record stats outcome
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'stats') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station') }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name stats --status success
          else
            python scripts/refresh_status.py phase --name stats --status failure --message "extended statistics fetch failed; rerun the stats phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-stats-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail stats phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  spatial:
    needs: [prepare, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-stats-${{ github.run_id }}
          path: .
      - name: Mark spatial skipped
        if: ${{ needs.prepare.outputs.resume_active != 'true' && needs.prepare.outputs.scope != 'all' && needs.prepare.outputs.scope != 'spatial' }}
        run: python scripts/refresh_status.py phase --name spatial --status skipped --message "scope not selected"
      - name: Mark spatial restored
        if: ${{ needs.prepare.outputs.resume_active == 'true' && needs.prepare.outputs.resume_phase == 'spatial' }}
        run: |
          python scripts/refresh_status.py phase --name spatial --status skipped \
            --message "database restored from run ${{ needs.prepare.outputs.resume_run_id }} artifact ${{ needs.prepare.outputs.resume_artifact }}"
      - name: Mark spatial running
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station' || needs.prepare.outputs.resume_phase == 'stats') }}
        run: python scripts/refresh_status.py phase --name spatial --status running
      - id: fetch
        name: Refresh urban, hazard, seismic and terrain layers
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station' || needs.prepare.outputs.resume_phase == 'stats') }}
        continue-on-error: true
        run: |
          test -n "$REINFOLIB_API_KEY" || (echo "REINFOLIB_API_KEY is missing" && exit 1)
          python scripts/fetch_extended_spatial.py --zoom 12 --interval 0.2
          python scripts/fetch_resilience.py --zoom 12 --interval 0.2
          python scripts/fetch_jshis.py --interval 0.2
          python scripts/fetch_gsi_elevation.py --interval 0.15
      - name: Record spatial outcome
        if: ${{ (needs.prepare.outputs.scope == 'all' || needs.prepare.outputs.scope == 'spatial') && (needs.prepare.outputs.resume_active != 'true' || needs.prepare.outputs.resume_phase == 'prepare' || needs.prepare.outputs.resume_phase == 'core' || needs.prepare.outputs.resume_phase == 'station' || needs.prepare.outputs.resume_phase == 'stats') }}
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name spatial --status success
          else
            python scripts/refresh_status.py phase --name spatial --status failure --message "spatial fetch failed; rerun the spatial phase"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-db-spatial-${{ github.run_id }}
          path: |
            database/area_insights.db
            data/cache/refresh-run.json
          retention-days: ${{ env.DB_ARTIFACT_RETENTION_DAYS }}
      - name: Fail spatial phase
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: exit 1

  build:
    needs: [prepare, spatial]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: refresh-db-spatial-${{ github.run_id }}
          path: .
      - name: Mark build running
        run: python scripts/refresh_status.py phase --name build --status running
      - id: build
        name: Validate, score, build and test
        continue-on-error: true
        run: |
          python scripts/validate_refresh_db.py --require-stations
          python scripts/compute_scores.py
          python scripts/compute_station_scores.py
          python scripts/compute_detailed_analysis.py
          python scripts/build_site.py
          pytest -q
      - name: Record build outcome
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            python scripts/refresh_status.py phase --name build --status success
          else
            python scripts/refresh_status.py phase --name build --status failure --message "validation/build/test failed; public JSON was not committed"
          fi
          python scripts/refresh_status.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            data/cache/refresh-run.json
            web/data/refresh-status.json
          retention-days: 7
      - name: Stop before publishing on validation failure
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
      - name: Save validated database for the next incremental run
        uses: actions/cache/save@v4
        with:
          path: database/area_insights.db
          key: area-insights-db-${{ runner.os }}-main-${{ github.run_id }}
      - name: Refuse stale-code publication
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main moved from $GITHUB_SHA to $current_main while data was refreshing."
            echo "The validated database was cached. Re-run with scope=build from the latest main."
            exit 1
          fi
      - name: Commit generated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "data: refresh public area datasets"
            git push origin HEAD:main
          fi
